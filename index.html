<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>诗词展示 - vvka.com</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #181818;
            font-family: 'SimSun', 'Microsoft YaHei', serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* 主内容区域 */
        .main-content {
            flex: 1;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 60px 20px 40px 20px;
            overflow-y: auto;
        }

        /* 诗词卡片 - 国画背景（主题依赖） */
        .poem-card {
            border-radius: 16px;
            padding: 60px 80px;
            max-width: 700px;
            width: 100%;
            animation: fadeIn 0.6s ease-in-out;
            text-align: center;
            transition: box-shadow 0.4s ease, transform 0.4s ease, background 0.4s ease;
        }
        /* ...其余样式已略，完整样式请见先前版本... */
    </style>
</head>
<body>
    <!-- 主内容区域 -->
    <div class="main-content">
        <div class="poem-card">
            <div class="poem-title" id="poemTitle">加载中...</div>
            <div class="poem-content" id="poemContent">
                <div class="loading"></div>
            </div>
            <div class="poem-meta">
                <div class="poem-author" id="poemAuthor">作者</div>
                <div class="poem-dynasty" id="poemDynasty">朝代</div>
                <div class="poem-period" id="poemPeriod">年代</div>
            </div>
            <div class="poem-info" id="poemInfo"></div>
            <div class="poem-extra" id="poemExtra"></div>
            <div class="hint">💡 按空格键或刷新页面查看下一首诗词</div>
        </div>
    </div>

    <!-- 底部搜索栏 -->
    <div class="search-bar">
        <div class="search-center">
            <input 
                type="text" 
                class="search-input" 
                id="searchInput" 
                placeholder="搜索诗词、作者、朝代..."
                autocomplete="off"
            >
            <button class="search-btn" id="searchBtn">搜索</button>
            <div class="search-result-nav" id="searchResultNav" style="display:none;">
                <button class="search-nav-btn" id="prevBtn" onclick="prevSearchResult()">‹</button>
                <span class="search-result-count" id="searchResultCount"></span>
                <button class="search-nav-btn" id="nextBtn" onclick="nextSearchResult()">›</button>
                <button class="search-nav-btn search-nav-close" onclick="clearSearch()">✕</button>
            </div>
            <select class="category-select" id="categorySelect">
                <option value="all" selected>全部</option>
                <option value="tang">唐诗</option>
                <option value="quanTangshi">全唐诗</option>
                <option value="yuding">御定全唐詩</option>
                <option value="song">宋词</option>
                <option value="wudai">五代诗词</option>
                <option value="yuanqu">元曲</option>
                <option value="classics">经典文献</option>
            </select>
        </div>
        <!-- 主题切换 -->
        <div class="theme-switcher">
            <button class="theme-btn active" data-theme="midnight" title="深夜静谧"></button>
            <button class="theme-btn" data-theme="moonlight" title="月白清雅"></button>
            <button class="theme-btn" data-theme="ink" title="墨韵古朴"></button>
            <button class="theme-btn" data-theme="sakura" title="樱花粉韵"></button>
        </div>
    </div>
    <script>
        // ... 保留完整原版 JS，这里省略，详细内容见历史版本 ...
    </script>
</body>
</html>
