<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>诗词展示 - vvka.com</title>
    <style>
        html,body {
            background: #fff;
            color: #222;
            font-family: 'Helvetica Neue', 'Arial', 'Microsoft YaHei', 'PingFang SC', sans-serif;
            font-size: 17px;
            line-height: 1.8;
            height: 100%;
        }
        * {
            box-sizing: border-box;
        }
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding: 0;
        }
        .main-content {
            flex: 1;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 60px 10px 40px 10px;
            overflow-y: auto;
        }
        .poem-card {
            background: #fafafa;
            border-radius: 14px;
            box-shadow: 0 1px 8px rgba(28,30,34,0.045);
            border: 1px solid #ececec;
            padding: 48px 32px;
            max-width: 600px;
            width: 100%;
            margin: 0 auto;
            text-align: center;
            transition: box-shadow .1s;
        }
        .poem-title {
            font-size: 2em;
            font-weight: 600;
            margin-bottom: 24px;
            color: #111111;
            letter-spacing: 0.06em;
            text-shadow: none;
        }
        .poem-content {
            font-size: 1.125em;
            margin-bottom: 32px;
        }
        .poem-line {
            margin: 10px 0;
        }
        .poem-meta {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 18px;
            margin-top: 28px;
            padding-top: 14px;
            font-size: 15px;
            font-weight: 400;
            color: #666;
            border-top: 1px solid #eee;
        }
        .poem-author::before { content: "作者："; color: #bbb; margin-right:3px; }
        .poem-dynasty::before{ content: "【"; color: #bbb; }
        .poem-dynasty::after{ content: "】"; color: #bbb; }
        .poem-period::before { content: "年代："; color: #bbb; margin-right:3px; }
        .poem-info, .poem-extra {
            margin-top: 12px;
            border-top: 1px solid #ececec;
            color: #888;
            font-size: 0.97em;
            padding-top: 10px;
        }
        .hint {
            color: #aaa;
            font-size: 13px;
            margin-top: 25px;
        }
        /* 搜索栏简洁化 */
        .search-bar {
            min-height: 52px;
            background: #fff;
            border-top: 1px solid #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 0 16px;
        }
        .search-center {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            justify-content: flex-start;
        }
        .search-input {
            height: 38px;
            border: 1px solid #dfdfdf;
            border-radius: 5px;
            padding: 0 10px;
            font-size: 15px;
            background: #f9f9f9;
            color: #222;
            width: 180px;
            max-width: 240px;
            transition: border-color .2s;
        }
        .search-input:focus {
            border-color: #bdbdbd;
            outline: none;
        }
        .search-btn {
            border: none;
            background: #2275d7;
            color: #fff;
            border-radius: 4px;
            height: 36px;
            padding: 0 18px;
            font-size: 15px;
            cursor: pointer;
            transition: background .15s;
        }
        .search-btn:hover { background: #1760b2; }
        .category-select {
            border: 1px solid #dfdfdf;
            border-radius: 5px;
            background: #fff;
            height: 36px;
            font-size: 15px;
            padding: 0 10px;
            color: #333;
        }
        .search-result-nav{
            display: flex;
            gap: 4px;
            align-items: center;
        }
        .search-nav-btn, .search-nav-close{
            height: 30px;
            width: 30px;
            border: none;
            background: #f2f3f6;
            color: #888;
            border-radius: 4px;
            font-size: 1.1em;
            cursor: pointer;
            transition: background .15s;
        }
        .search-nav-btn:hover {background: #e2e2e2; color:#333;}
        .search-nav-btn:disabled {opacity:.5; cursor: default;}
        .theme-switcher {
            display: flex;
            gap: 2px;
        }
        .theme-btn {
            width: 18px; height: 18px;
            border-radius: 50%;
            border: 1px solid #c0c0c0;
            background: #f3f3f3;
            margin: 0 1px;
            cursor: pointer;
        }
        .theme-btn.active { border-color: #2275d7; }
        /* mark高亮 */
        mark {background:#ffe0a0; color: #111; border-radius: 2px; padding: 1px 3px;}
        /* 响应式 */
        @media (max-width:700px) {
            .main-content{ padding-top:24px; }
            .poem-card{ padding:18px 2px; }
            .poem-title{ font-size:1.2em; }
            .poem-content{ font-size:1em; }
            .poem-meta{ flex-direction: column; gap: 4px; font-size: 14px; }
            .search-bar{ flex-direction:column; gap:8px; padding:10px; }
            .search-input{ width:100%; max-width: unset; }
        }
        img { max-width:100%; height:auto; border-radius:4px; margin:10px 0; }
        .loading {
            display:inline-block;
            width:12px; height:12px;
            border-radius:50%;
            background:#2275d7;
            animation: pulse 1.2s infinite;
        }
        @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.35;} }
    </style>
</head>
<body>
    <!-- 主内容区域 -->
    <div class="main-content">
        <div class="poem-card">
            <div class="poem-title" id="poemTitle">加载中...</div>
            <div class="poem-content" id="poemContent">
                <div class="loading"></div>
            </div>
            <div class="poem-meta">
                <div class="poem-author" id="poemAuthor">作者</div>
                <div class="poem-dynasty" id="poemDynasty">朝代</div>
                <div class="poem-period" id="poemPeriod">年代</div>
            </div>
            <div class="poem-info" id="poemInfo"></div>
            <div class="poem-extra" id="poemExtra"></div>
            <div class="hint">💡 按空格键或刷新页面查看下一首诗词</div>
        </div>
    </div>
    <!-- 底部搜索栏 -->
    <div class="search-bar">
        <div class="search-center">
            <input 
                type="text" 
                class="search-input" 
                id="searchInput" 
                placeholder="搜索诗词、作者、朝代..."
                autocomplete="off"
            >
            <button class="search-btn" id="searchBtn">搜索</button>
            <div class="search-result-nav" id="searchResultNav" style="display:none;">
                <button class="search-nav-btn" id="prevBtn" onclick="prevSearchResult()">‹</button>
                <span class="search-result-count" id="searchResultCount"></span>
                <button class="search-nav-btn" id="nextBtn" onclick="nextSearchResult()">›</button>
                <button class="search-nav-btn search-nav-close" onclick="clearSearch()">✕</button>
            </div>
            <select class="category-select" id="categorySelect">
                <option value="all" selected>全部</option>
                <option value="tang">唐诗</option>
                <option value="quanTangshi">全唐诗</option>
                <option value="yuding">御定全唐詩</option>
                <option value="song">宋词</option>
                <option value="wudai">五代诗词</option>
                <option value="yuanqu">元曲</option>
                <option value="classics">经典文献</option>
            </select>
        </div>
        <!-- 主题切换 -->
        <div class="theme-switcher">
            <button class="theme-btn active" data-theme="midnight" title="深夜静谧"></button>
            <button class="theme-btn" data-theme="moonlight" title="月白清雅"></button>
            <button class="theme-btn" data-theme="ink" title="墨韵古朴"></button>
            <button class="theme-btn" data-theme="sakura" title="樱花粉韵"></button>
        </div>
    </div>
    <!-- 保持你的原始 JS（略，下略） -->
    <script>
        // 保留你的原有 JS 脚本内容不变 ...
    </script>
</body>
</html>
